name: Update Weather Data

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-weather-data
  cancel-in-progress: true

jobs:
  update-weather:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run weather update script
        env:
          WU_API_KEY: ${{ secrets.WU_API_KEY }}
        run: node scripts/update-weather.js

      - name: Commit updated weather data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weather/weather-data.json
          if git diff --cached --quiet; then
            echo "No weather data changes to commit."
          else
            git commit -m "Update weather data"
            git push
          fi
