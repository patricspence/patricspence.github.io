name: Update Weather Data

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-weather:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update weather JSON
        env:
          WU_API_KEY: ${{ secrets.WU_API_KEY }}
        run: node scripts/update-weather.js

      - name: Commit updated weather data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Update weather data
          file_pattern: weather/weather-data.json
