```yaml
name: Update Weather Data

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-weather:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Update weather-data.json
        env:
          WU_API_KEY: ${{ secrets.WU_API_KEY }}
        run: node scripts/update-weather.js

      - name: Commit updated weather data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Update weather data
          file_pattern: weather/weather-data.json
```
