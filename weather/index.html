<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather Dashboard</title>
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root, [data-theme="light"] {
      --text-xs: clamp(0.75rem, 0.7rem + 0.25vw, 0.875rem);
      --text-sm: clamp(0.875rem, 0.8rem + 0.35vw, 1rem);
      --text-base: clamp(1rem, 0.95rem + 0.25vw, 1.125rem);
      --text-lg: clamp(1.125rem, 1rem + 0.75vw, 1.5rem);
      --text-xl: clamp(1.5rem, 1.2rem + 1.25vw, 2.25rem);
      --space-1: 0.25rem; --space-2: 0.5rem; --space-3: 0.75rem; --space-4: 1rem;
      --space-5: 1.25rem; --space-6: 1.5rem; --space-8: 2rem; --space-10: 2.5rem;
      --space-12: 3rem; --space-16: 4rem;
      --color-bg: #f7f6f2; --color-surface: #f9f8f5; --color-surface-2: #fbfbf9;
      --color-surface-offset: #edeae5; --color-border: #d4d1ca; --color-divider: #dcd9d5;
      --color-text: #28251d; --color-text-muted: #7a7974; --color-text-inverse: #f9f8f4;
      --color-primary: #01696f; --color-primary-hover: #0c4e54; --color-primary-highlight: #cedcd8;
      --radius-md: 0.5rem; --radius-lg: 0.75rem; --radius-xl: 1rem; --radius-full: 9999px;
      --shadow-sm: 0 1px 2px rgba(0,0,0,.06); --shadow-md: 0 8px 24px rgba(0,0,0,.08);
      --transition: 180ms cubic-bezier(0.16, 1, 0.3, 1);
      --font-body: Inter, system-ui, sans-serif;
    }
    [data-theme="dark"] {
      --color-bg: #171614; --color-surface: #1c1b19; --color-surface-2: #201f1d;
      --color-surface-offset: #22211f; --color-border: #393836; --color-divider: #262523;
      --color-text: #cdccca; --color-text-muted: #979591; --color-text-inverse: #171614;
      --color-primary: #4f98a3; --color-primary-hover: #69aab3; --color-primary-highlight: #313b3b;
      --shadow-sm: 0 1px 2px rgba(0,0,0,.2); --shadow-md: 0 12px 32px rgba(0,0,0,.35);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; }
    body {
      min-height: 100vh; font-family: var(--font-body); font-size: var(--text-base);
      line-height: 1.6; background: var(--color-bg); color: var(--color-text);
    }
    a, button, iframe { transition: all var(--transition); }
    button { cursor: pointer; border: none; background: none; color: inherit; }
    code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
    }
    .page {
      width: min(1440px, calc(100% - 2rem)); margin: 0 auto; padding: var(--space-6) 0 var(--space-8);
    }
    .topbar {
      display: flex; align-items: center; justify-content: space-between; gap: var(--space-4);
      margin-bottom: var(--space-5); padding: var(--space-4) 0 var(--space-3);
    }
    .brand { display: flex; align-items: center; gap: var(--space-3); }
    .brand-mark {
      width: 2.5rem; height: 2.5rem; border-radius: var(--radius-lg); background: var(--color-primary-highlight);
      color: var(--color-primary); display: grid; place-items: center; border: 1px solid color-mix(in srgb, var(--color-primary) 20%, var(--color-border));
      box-shadow: var(--shadow-sm);
    }
    .brand h1 { font-size: var(--text-lg); line-height: 1.2; }
    .brand p { font-size: var(--text-sm); color: var(--color-text-muted); }
    .controls, .quick-links {
      display: flex; gap: var(--space-3); flex-wrap: wrap; align-items: center;
    }
    .toolbar {
      display: flex; justify-content: space-between; gap: var(--space-4); flex-wrap: wrap;
      margin-bottom: var(--space-6);
    }
    .btn {
      min-height: 44px; padding: 0.75rem 1rem; border-radius: var(--radius-full); font-size: var(--text-sm);
      border: 1px solid var(--color-border); background: var(--color-surface); box-shadow: var(--shadow-sm);
      text-decoration: none; display: inline-flex; align-items: center; justify-content: center;
      color: var(--color-text);
    }
    .btn:hover { background: var(--color-surface-2); }
    .btn-primary { background: var(--color-primary); color: var(--color-text-inverse); border-color: transparent; }
    .btn-primary:hover { background: var(--color-primary-hover); }
    .btn-subtle { background: var(--color-surface-offset); }
    .statusbar {
      display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-4); margin-bottom: var(--space-6);
    }
    .stat {
      padding: var(--space-4); background: var(--color-surface); border: 1px solid var(--color-border);
      border-radius: var(--radius-xl); box-shadow: var(--shadow-sm);
    }
    .stat-label { font-size: var(--text-xs); text-transform: uppercase; letter-spacing: 0.08em; color: var(--color-text-muted); }
    .stat-value { font-size: var(--text-base); margin-top: var(--space-2); }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-5); }
    .panel {
      background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-xl);
      overflow: hidden; box-shadow: var(--shadow-md);
    }
    .panel-head {
      display: flex; align-items: center; justify-content: space-between; gap: var(--space-4);
      padding: var(--space-4); border-bottom: 1px solid var(--color-divider); background: var(--color-surface-2);
    }
    .panel-title h2 { font-size: var(--text-base); line-height: 1.2; }
    .panel-title p { font-size: var(--text-sm); color: var(--color-text-muted); }
    .panel-links {
      display: flex; gap: var(--space-2); flex-wrap: wrap;
    }
    .panel-links a {
      display: inline-flex; align-items: center; min-height: 40px; padding: 0.5rem 0.875rem; border-radius: var(--radius-full);
      background: var(--color-surface-offset); color: var(--color-text); text-decoration: none; font-size: var(--text-sm);
      border: 1px solid var(--color-border);
    }
    .panel-links a:hover { border-color: var(--color-primary); color: var(--color-primary); }
    .frame-wrap { height: min(74vh, 920px); background: var(--color-surface-offset); }
    iframe { width: 100%; height: 100%; border: 0; background: white; }
    .note {
      margin-top: var(--space-5); color: var(--color-text-muted); font-size: var(--text-sm); text-align: center;
    }
    @media (max-width: 980px) {
      .statusbar, .grid { grid-template-columns: 1fr; }
      .topbar, .panel-head { align-items: flex-start; flex-direction: column; }
      .frame-wrap { height: 68vh; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { transition-duration: 0.01ms !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
